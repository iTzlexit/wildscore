name: CI

# Runs the same gates as scripts/check.ps1, on every push and pull request.
# The pre-commit hook can be bypassed or simply not enabled on a fresh clone;
# this cannot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      - name: Check formatting
        working-directory: app
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: check
    # Only on main — no point burning minutes building every PR push.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      - name: Build release APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi

      # Debug-signed. Fine for sideloading to testers, never for the Play
      # Store — release signing is a Phase 5 task with a real keystore.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wildscore-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
