<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild Score — settle the rankings</title>
<style>
 :root{--bg:#f6f6f3;--card:#fff;--ink:#151a17;--mute:#8a938c;--line:#e2e4de;--accent:#1b7a54}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);
      font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 header{position:sticky;top:0;z-index:20;background:#fffffff5;backdrop-filter:blur(8px);
        border-bottom:1px solid var(--line);padding:10px 16px;
        display:flex;gap:10px;align-items:center;flex-wrap:wrap}
 h1{font-size:15px;margin:0;font-weight:800;margin-right:auto}
 .count{color:var(--mute);font-size:13px}
 button{font:inherit;font-weight:700;border-radius:9px;padding:8px 13px;
        border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
 button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
 button:disabled{opacity:.4;cursor:default}
 main{padding:16px;max-width:940px;margin:0 auto}
 .hide{display:none!important}

 /* duel */
 .lede{text-align:center;color:#3d463f;margin:6px 0 20px;line-height:1.5}
 .lede b{color:var(--ink)}
 .duel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 .pick{background:var(--card);border:2px solid var(--line);border-radius:16px;
       padding:22px 14px;cursor:pointer;text-align:center;transition:.12s;
       display:flex;flex-direction:column;justify-content:center;min-height:170px}
 .pick:hover{border-color:var(--accent);transform:translateY(-2px)}
 .pick .nm{font-size:19px;font-weight:800;line-height:1.25}
 .pick .sci{color:var(--mute);font-size:12px;font-style:italic;margin-top:5px}
 .pick .cur{margin-top:12px;font-size:10.5px;font-weight:800;letter-spacing:1px;
            color:var(--mute)}
 .mid{text-align:center;margin:16px 0;color:var(--mute);font-size:13px}
 .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:18px 0 0}
 .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}

 /* results */
 .grp{margin:24px 0 8px;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--mute)}
 .row{background:var(--card);border:1px solid var(--line);border-radius:11px;
      padding:9px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
 .row .nm{font-weight:700;flex:1;font-size:14.5px}
 .row .moved{font-size:11px;font-weight:800;color:var(--accent);white-space:nowrap}
 .row select{font:inherit;font-size:13px;padding:5px 7px;border-radius:8px;
             border:1px solid var(--line);background:#fff;color:var(--ink)}
 .t0{border-left:5px solid #77817a}.t1{border-left:5px solid #2e8b57}
 .t2{border-left:5px solid #2372a8}.t3{border-left:5px solid #6b47c0}
 .t4{border-left:5px solid #c26a15}.t5{border-left:5px solid #c0392b}
 .t6{border-left:5px solid #9c6b10}
 #out{position:fixed;inset:auto 12px 12px 12px;max-width:620px;margin:0 auto;background:#fff;
      border:1px solid var(--line);border-radius:16px;padding:16px;display:none;
      box-shadow:0 10px 40px #0003;z-index:30}
 textarea{width:100%;height:140px;font:12px/1.4 ui-monospace,monospace;
          border:1px solid var(--line);border-radius:10px;padding:10px}
</style>
<header>
  <h1>Settle the rankings</h1>
  <span class="count" id="count"></span>
  <button id="modeBtn" onclick="toggle()">See the order</button>
  <button class="primary" onclick="exp()">Export</button>
</header>
<main>
  <section id="duel">
    <p class="lede">Which is <b>harder to find</b> in Kruger?<br>
       Not which is more exciting — which one would you drive more days without seeing.</p>
    <div class="duel">
      <div class="pick" id="pA" onclick="choose(0)"></div>
      <div class="pick" id="pB" onclick="choose(1)"></div>
    </div>
    <div class="mid">
      <button onclick="skip()">Too close to call</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <p class="lede" id="progText" style="margin-top:10px"></p>
  </section>

  <section id="list" class="hide">
    <p class="lede">Every species in the order your answers put them, rarest first.
       Override any tier directly.</p>
    <div id="rows"></div>
  </section>
</main>
<div id="out">
  <p style="margin:0 0 8px"><b>Paste this back into the chat.</b></p>
  <textarea id="json" readonly></textarea>
  <p style="margin:10px 0 0"><button onclick="cp()">Copy</button>
  <button onclick="document.getElementById('out').style.display='none'">Close</button></p>
</div>
<script>
const SP = [{"id":"aardvark","name":"Aardvark","sci":"Orycteropus afer","cat":"mammal","tier":"veryRare"},{"id":"aardwolf","name":"Aardwolf","sci":"Proteles cristata","cat":"mammal","tier":"veryRare"},{"id":"african-civet","name":"African Civet","sci":"Civettictis civetta","cat":"mammal","tier":"scarce"},{"id":"african-elephant","name":"African Elephant","sci":"Loxodonta africana","cat":"mammal","tier":"frequent"},{"id":"african-wild-dog","name":"African Wild Dog","sci":"Lycaon pictus","cat":"mammal","tier":"rare"},{"id":"african-wildcat","name":"African Wildcat","sci":"Felis lybica","cat":"mammal","tier":"rare"},{"id":"banded-mongoose","name":"Banded Mongoose","sci":"Mungos mungo","cat":"mammal","tier":"frequent"},{"id":"bat-eared-fox","name":"Bat-eared Fox","sci":"Otocyon megalotis","cat":"mammal","tier":"veryRare"},{"id":"black-rhinoceros","name":"Black Rhinoceros","sci":"Diceros bicornis","cat":"mammal","tier":"veryRare"},{"id":"black-backed-jackal","name":"Black-backed Jackal","sci":"Lupulella mesomelas","cat":"mammal","tier":"frequent"},{"id":"blue-wildebeest","name":"Blue Wildebeest","sci":"Connochaetes taurinus","cat":"mammal","tier":"common"},{"id":"brown-hyena","name":"Brown Hyena","sci":"Parahyaena brunnea","cat":"mammal","tier":"legendary"},{"id":"bushbuck","name":"Bushbuck","sci":"Tragelaphus sylvaticus","cat":"mammal","tier":"frequent"},{"id":"bushpig","name":"Bushpig","sci":"Potamochoerus larvatus","cat":"mammal","tier":"scarce"},{"id":"cape-buffalo","name":"Cape Buffalo","sci":"Syncerus caffer","cat":"mammal","tier":"frequent"},{"id":"cape-porcupine","name":"Cape Porcupine","sci":"Hystrix africaeaustralis","cat":"mammal","tier":"scarce"},{"id":"caracal","name":"Caracal","sci":"Caracal caracal","cat":"mammal","tier":"legendary"},{"id":"chacma-baboon","name":"Chacma Baboon","sci":"Papio ursinus","cat":"mammal","tier":"common"},{"id":"cheetah","name":"Cheetah","sci":"Acinonyx jubatus","cat":"mammal","tier":"rare"},{"id":"common-duiker","name":"Common Duiker","sci":"Sylvicapra grimmia","cat":"mammal","tier":"frequent"},{"id":"eland","name":"Common Eland","sci":"Taurotragus oryx","cat":"mammal","tier":"scarce"},{"id":"dwarf-mongoose","name":"Dwarf Mongoose","sci":"Helogale parvula","cat":"mammal","tier":"frequent"},{"id":"eastern-rock-elephant-shrew","name":"Eastern Rock Elephant Shrew","sci":"Elephantulus myurus","cat":"mammal","tier":"rare"},{"id":"giraffe","name":"Giraffe","sci":"Giraffa camelopardalis","cat":"mammal","tier":"common"},{"id":"greater-kudu","name":"Greater Kudu","sci":"Tragelaphus strepsiceros","cat":"mammal","tier":"common"},{"id":"ground-pangolin","name":"Ground Pangolin","sci":"Smutsia temminckii","cat":"mammal","tier":"legendary"},{"id":"hippopotamus","name":"Hippopotamus","sci":"Hippopotamus amphibius","cat":"mammal","tier":"common"},{"id":"honey-badger","name":"Honey Badger","sci":"Mellivora capensis","cat":"mammal","tier":"scarce"},{"id":"impala","name":"Impala","sci":"Aepyceros melampus","cat":"mammal","tier":"common"},{"id":"klipspringer","name":"Klipspringer","sci":"Oreotragus oreotragus","cat":"mammal","tier":"uncommon"},{"id":"large-spotted-genet","name":"Large-spotted Genet","sci":"Genetta maculata","cat":"mammal","tier":"scarce"},{"id":"leopard","name":"Leopard","sci":"Panthera pardus","cat":"mammal","tier":"scarce"},{"id":"lesser-bushbaby","name":"Lesser Bushbaby","sci":"Galago moholi","cat":"mammal","tier":"scarce"},{"id":"lion","name":"Lion","sci":"Panthera leo","cat":"mammal","tier":"uncommon"},{"id":"mountain-reedbuck","name":"Mountain Reedbuck","sci":"Redunca fulvorufula","cat":"mammal","tier":"rare"},{"id":"nyala","name":"Nyala","sci":"Tragelaphus angasii","cat":"mammal","tier":"frequent"},{"id":"plains-zebra","name":"Plains Zebra","sci":"Equus quagga","cat":"mammal","tier":"common"},{"id":"roan-antelope","name":"Roan Antelope","sci":"Hippotragus equinus","cat":"mammal","tier":"rare"},{"id":"sable-antelope","name":"Sable Antelope","sci":"Hippotragus niger","cat":"mammal","tier":"scarce"},{"id":"scrub-hare","name":"Scrub Hare","sci":"Lepus saxatilis","cat":"mammal","tier":"frequent"},{"id":"serval","name":"Serval","sci":"Leptailurus serval","cat":"mammal","tier":"rare"},{"id":"sharpes-grysbok","name":"Sharpe's Grysbok","sci":"Raphicerus sharpei","cat":"mammal","tier":"scarce"},{"id":"slender-mongoose","name":"Slender Mongoose","sci":"Herpestes sanguineus","cat":"mammal","tier":"frequent"},{"id":"southern-reedbuck","name":"Southern Reedbuck","sci":"Redunca arundinum","cat":"mammal","tier":"scarce"},{"id":"spotted-hyena","name":"Spotted Hyena","sci":"Crocuta crocuta","cat":"mammal","tier":"frequent"},{"id":"steenbok","name":"Steenbok","sci":"Raphicerus campestris","cat":"mammal","tier":"common"},{"id":"suni","name":"Suni","sci":"Neotragus moschatus","cat":"mammal","tier":"veryRare"},{"id":"thick-tailed-bushbaby","name":"Thick-tailed Bushbaby","sci":"Otolemur crassicaudatus","cat":"mammal","tier":"scarce"},{"id":"tree-squirrel","name":"Tree Squirrel","sci":"Paraxerus cepapi","cat":"mammal","tier":"common"},{"id":"tsessebe","name":"Tsessebe","sci":"Damaliscus lunatus","cat":"mammal","tier":"scarce"},{"id":"vervet-monkey","name":"Vervet Monkey","sci":"Chlorocebus pygerythrus","cat":"mammal","tier":"common"},{"id":"warthog","name":"Warthog","sci":"Phacochoerus africanus","cat":"mammal","tier":"common"},{"id":"waterbuck","name":"Waterbuck","sci":"Kobus ellipsiprymnus","cat":"mammal","tier":"common"},{"id":"white-rhinoceros","name":"White Rhinoceros","sci":"Ceratotherium simum","cat":"mammal","tier":"uncommon"},{"id":"white-tailed-mongoose","name":"White-tailed Mongoose","sci":"Ichneumia albicauda","cat":"mammal","tier":"uncommon"},{"id":"african-fish-eagle","name":"African Fish Eagle","sci":"Haliaeetus vocifer","cat":"bird","tier":"frequent"},{"id":"bateleur","name":"Bateleur","sci":"Terathopius ecaudatus","cat":"bird","tier":"frequent"},{"id":"kori-bustard","name":"Kori Bustard","sci":"Ardeotis kori","cat":"bird","tier":"uncommon"},{"id":"lappet-faced-vulture","name":"Lappet-faced Vulture","sci":"Torgos tracheliotos","cat":"bird","tier":"scarce"},{"id":"lilac-breasted-roller","name":"Lilac-breasted Roller","sci":"Coracias caudatus","cat":"bird","tier":"common"},{"id":"martial-eagle","name":"Martial Eagle","sci":"Polemaetus bellicosus","cat":"bird","tier":"scarce"},{"id":"pels-fishing-owl","name":"Pel's Fishing Owl","sci":"Scotopelia peli","cat":"bird","tier":"legendary"},{"id":"red-billed-buffalo-weaver","name":"Red-billed Buffalo Weaver","sci":"Bubalornis niger","cat":"bird","tier":"frequent"},{"id":"saddle-billed-stork","name":"Saddle-billed Stork","sci":"Ephippiorhynchus senegalensis","cat":"bird","tier":"scarce"},{"id":"southern-ground-hornbill","name":"Southern Ground Hornbill","sci":"Bucorvus leadbeateri","cat":"bird","tier":"uncommon"},{"id":"verreauxs-eagle-owl","name":"Verreaux's Eagle-Owl","sci":"Bubo lacteus","cat":"bird","tier":"uncommon"},{"id":"white-backed-vulture","name":"White-backed Vulture","sci":"Gyps africanus","cat":"bird","tier":"frequent"},{"id":"black-mamba","name":"Black Mamba","sci":"Dendroaspis polylepis","cat":"reptile","tier":"rare"},{"id":"leopard-tortoise","name":"Leopard Tortoise","sci":"Stigmochelys pardalis","cat":"reptile","tier":"frequent"},{"id":"nile-crocodile","name":"Nile Crocodile","sci":"Crocodylus niloticus","cat":"reptile","tier":"frequent"},{"id":"african-rock-python","name":"Southern African Rock Python","sci":"Python natalensis","cat":"reptile","tier":"rare"},{"id":"water-monitor","name":"Water Monitor","sci":"Varanus niloticus","cat":"reptile","tier":"frequent"},{"id":"ant-lion","name":"Ant Lion","sci":"Myrmeleontidae","cat":"invertebrate","tier":"uncommon"},{"id":"rhinoceros-beetle","name":"Rhinoceros Beetle","sci":"Oryctes boas","cat":"invertebrate","tier":"scarce"}]
;
const TIERS = [
 ['common','Common'],['frequent','Frequent'],['uncommon','Notable'],
 ['scarce','Rare'],['rare','Very rare'],['veryRare','Exceptional'],
 ['legendary','Legendary']];
const KEY='wildscore-duels-v2';

const orig = {}; SP.forEach(s => orig[s.id] = s.tier);
const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
// Elo rating per species. Seeded from the current tier so the first few
// answers refine an informed guess rather than starting from nothing.
const rating = {};
SP.forEach(s => rating[s.id] = saved.rating?.[s.id] ?? (1200 + TIERS.findIndex(t=>t[0]===s.tier) * 90));
let done = saved.done ?? 0;
let overrides = saved.overrides ?? {};
let pair = null, listMode = false;

const TARGET = 70;   // enough for a stable order across 74 species

function save(){
  localStorage.setItem(KEY, JSON.stringify({rating, done, overrides}));
}

/* ---- duel ---------------------------------------------------------- */

function nextPair(){
  // Compare near-neighbours: telling a pangolin from an impala teaches
  // nothing, telling a cheetah from a leopard is the whole question.
  const order = [...SP].sort((a,b) => rating[a.id] - rating[b.id]);
  const i = Math.floor(Math.random() * (order.length - 1));
  const window = Math.min(6, order.length - 1 - i);
  const j = i + 1 + Math.floor(Math.random() * window);
  pair = [order[i], order[j]];
  if (Math.random() < 0.5) pair.reverse();
  paintDuel();
}

function paintDuel(){
  ['pA','pB'].forEach((id, n) => {
    const s = pair[n];
    document.getElementById(id).innerHTML =
      `<div class="nm">${s.name}</div><div class="sci">${s.sci}</div>
       <div class="cur">NOW: ${TIERS.find(t=>t[0]===tierOf(s.id))[1].toUpperCase()}</div>`;
  });
  const pct = Math.min(100, done / TARGET * 100);
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('progText').textContent =
    done >= TARGET
      ? `${done} answered — that is plenty. Check the order, then export.`
      : `${done} of about ${TARGET}. Keep going until the order looks right.`;
  tally();
}

function choose(n){
  const winner = pair[n], loser = pair[1-n];
  elo(winner.id, loser.id, 1);
  done++; save(); nextPair();
}
function skip(){
  elo(pair[0].id, pair[1].id, 0.5);
  done++; save(); nextPair();
}

function elo(a, b, score){
  const K = 32;
  const ea = 1 / (1 + Math.pow(10, (rating[b] - rating[a]) / 400));
  rating[a] += K * (score - ea);
  rating[b] += K * ((1 - score) - (1 - ea));
}

/* ---- results ------------------------------------------------------- */

// Split the rated order into the seven tiers, keeping roughly the shape the
// catalogue already has — most animals are common, almost none are legendary.
const SHAPE = [0.18, 0.26, 0.16, 0.16, 0.12, 0.08, 0.04];

function computed(){
  const order = [...SP].sort((a,b) => rating[b.id] - rating[a.id]); // rarest first
  const out = {};
  let idx = 0;
  for (let t = TIERS.length - 1; t >= 0; t--){
    const take = t === 0 ? order.length - idx : Math.round(SHAPE[t] * order.length);
    for (let k = 0; k < take && idx < order.length; k++, idx++) out[order[idx].id] = TIERS[t][0];
  }
  return out;
}

function tierOf(id){ return overrides[id] ?? computed()[id] ?? orig[id]; }

function toggle(){
  listMode = !listMode;
  document.getElementById('duel').classList.toggle('hide', listMode);
  document.getElementById('list').classList.toggle('hide', !listMode);
  document.getElementById('modeBtn').textContent = listMode ? 'Back to comparing' : 'See the order';
  if (listMode) paintList();
}

function paintList(){
  const calc = computed();
  const order = [...SP].sort((a,b) => rating[b.id] - rating[a.id]);
  let html = '', last = null;
  order.forEach(s => {
    const t = overrides[s.id] ?? calc[s.id];
    if (t !== last){ last = t; html += `<div class="grp">${TIERS.find(x=>x[0]===t)[1].toUpperCase()}</div>`; }
    const ti = TIERS.findIndex(x=>x[0]===t);
    const moved = t !== orig[s.id]
      ? `<span class="moved">was ${TIERS.find(x=>x[0]===orig[s.id])[1]}</span>` : '';
    html += `<div class="row t${ti}"><span class="nm">${s.name}</span>${moved}
      <select onchange="override('${s.id}', this.value)">
      ${TIERS.map(x=>`<option value="${x[0]}"${x[0]===t?' selected':''}>${x[1]}</option>`).join('')}
      </select></div>`;
  });
  document.getElementById('rows').innerHTML = html;
  tally();
}

function override(id, tier){ overrides[id] = tier; save(); paintList(); }

function tally(){
  const calc = computed();
  const n = SP.filter(s => (overrides[s.id] ?? calc[s.id]) !== orig[s.id]).length;
  document.getElementById('count').textContent = `${n} would change`;
}

function exp(){
  const calc = computed();
  const out = {};
  SP.forEach(s => {
    const t = overrides[s.id] ?? calc[s.id];
    if (t !== orig[s.id]) out[s.id] = t;
  });
  document.getElementById('json').value = JSON.stringify({comparisons: done, changes: out});
  document.getElementById('out').style.display = 'block';
}
function cp(){ const t = document.getElementById('json'); t.select(); document.execCommand('copy'); }

nextPair();
</script>
