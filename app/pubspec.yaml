name: wildscore
description: A verified wildlife spotting game for Kruger National Park.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

  # GPS only. Works with no cell signal, which is the entire reason a road
  # label is possible in a park that has none. No coordinate is ever stored
  # or transmitted - see lib/data/location_service.dart.
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.1

flutter:
  uses-material-design: true

  # Variable fonts — one file each covers every weight. Bundled rather than
  # fetched: google_fonts downloads at runtime and this app has no network for
  # days at a time. Weights come from FontVariation, not FontWeight.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
  assets:
    - assets/data/
    - assets/species/
    - assets/silhouettes/
